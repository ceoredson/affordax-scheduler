name: ADMP Housekeeping

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: admp-housekeeping
  cancel-in-progress: false

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run maintenance
        env:
          MAINTENANCE_URL: ${{ secrets.MAINTENANCE_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          test -n "$MAINTENANCE_URL"
          test -n "$MAINTENANCE_TOKEN"
          curl --fail-with-body --retry 5 --retry-delay 15 --max-time 120 \
            -X POST "$MAINTENANCE_URL/internal/maintenance/?job=housekeeping" \
            -H "Authorization: Bearer $MAINTENANCE_TOKEN"
